<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEO-KSAT-X 문서 검토</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/nav.js"></script>
  <script defer src="/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div><strong>GEO-KSAT-X</strong><span class="subbrand">문서분석·추적성 검토</span></div>
    <span class="environment">GEO-KSAT-X · 문서 검토</span>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">LOCAL WORKSPACE</p><h1>문서함과 파싱 후보</h1>
        <p>PDF를 업로드하거나 준비된 문서를 다시 추출해 후보를 검토하세요. 검토할 항목만 선택해 저장할 수 있습니다.</p></div>
      <div class="stats" id="stats" aria-label="작업 현황"></div>
    </section>
    <div class="layout">
      <aside class="documents panel" aria-label="문서 목록">
        <div class="section-head"><h2>문서함</h2><span id="documentCount"></span></div>
        <label class="secondary upload-control">PDF 업로드<input id="pdfUpload" type="file" accept="application/pdf,.pdf" hidden></label>
        <div id="uploadProgress" class="muted" role="status" aria-live="polite"></div>
        <label class="search-label">문서 검색<input id="docSearch" type="search" placeholder="문서번호 또는 이름"></label>
        <div id="documents" class="document-list"></div>
        <button id="clearLibrary" class="secondary danger library-action" type="button" disabled>문서함 전체 비우기</button>
      </aside>
      <section class="workspace panel">
        <div class="section-head heading-row">
          <div><p class="eyebrow" id="currentDocType">문서 선택</p><h2 id="currentDoc">왼쪽에서 문서를 선택하세요</h2><p id="currentMeta" class="muted"></p></div>
          <div class="head-actions"><button id="pdfButton" class="secondary" disabled>PDF 원문</button><button id="extractButton" class="secondary" disabled>PDF 다시 추출</button><button id="saveButton" class="primary" disabled>선택 항목 저장</button><button id="deleteButton" class="secondary danger" type="button" disabled>현재 문서 삭제</button></div>
        </div>
        <nav class="tabs" aria-label="작업 영역"><button id="candidatesTab" class="active" aria-current="page">파싱 후보</button><button id="traceTab">저장 항목·검토</button></nav>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <div id="candidateView">
          <div class="toolbar"><div><strong id="candidateSummary">후보 0건</strong><span class="muted">수정과 저장 선택은 별개입니다.</span></div><div><button id="selectAll" class="secondary" disabled>전체 선택</button><button id="clearAll" class="secondary" disabled>선택 해제</button></div></div>
          <div class="table-wrap"><table><thead><tr><th scope="col">저장</th><th scope="col">항목 ID</th><th scope="col">유형</th><th scope="col">제목·내용</th><th scope="col">페이지</th><th scope="col">상태</th></tr></thead><tbody id="candidateRows"></tbody></table></div>
        </div>
        <div id="traceView" hidden>
          <div class="toolbar"><label class="search-label">현재 문서의 저장 항목 검색<input id="traceSearch" type="search" placeholder="항목 ID, 제목 또는 본문"></label><span class="muted">선택한 문서에 저장된 항목만 나타납니다.</span></div>
          <div class="table-wrap"><table><thead><tr><th scope="col">항목 ID</th><th scope="col">문서</th><th scope="col">유형</th><th scope="col">제목·내용</th><th scope="col">페이지</th></tr></thead><tbody id="traceRows"></tbody></table></div>
        </div>
      </section>
    </div>
  </main>
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="detail" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div id="resizeHandle" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="상세 패널 너비 조절" tabindex="0"></div>
    <header class="detail-head"><div><p class="eyebrow" id="detailKind"></p><h2 id="detailTitle"></h2></div><button id="closeDetail" class="secondary" aria-label="상세 패널 닫기">닫기</button></header>
    <div class="detail-tools"><button id="narrowDetail" class="secondary">좁게</button><button id="wideDetail" class="secondary">넓게</button><button id="defaultDetail" class="secondary">기본 크기</button><span id="widthLabel" class="muted"></span></div>
    <div id="detailBody" class="detail-body"></div>
  </aside>
</body>
</html>
