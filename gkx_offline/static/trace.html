<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추적성 대조 · GEO-KSAT-X</title><link rel="stylesheet" href="/style.css"><script defer src="/nav.js"></script><script defer src="/pages.js"></script></head>
<body data-page="trace"><header class="topbar"><div><strong>GEO-KSAT-X</strong><span class="subbrand">문서분석·추적성 검토</span></div><span class="environment">GEO-KSAT-X · 문서 검토</span></header>
<main class="extra-page"><p class="eyebrow">TRACEABILITY</p><h1>추적성 대조</h1><p class="page-lead">저장된 항목의 상위·하위 요구 ID와 검증 연결을 확인합니다. 미연결은 자동 결함 판정이 아닙니다.</p>
<section class="panel pad"><div class="filter-row"><label>검색<input id="traceQuery" type="search" placeholder="항목 ID·제목·본문"></label><label>검증방법<select id="traceMethod"><option value="">전체</option><option>I</option><option>A</option><option>D</option><option>T</option></select></label><label>연결 상태<select id="traceRelation"><option value="">전체</option><option value="no-parent">상위 ID 없음</option><option value="no-child">하위 ID 없음</option><option value="multi-parent">다중 상위</option></select></label></div><p id="traceCount" class="muted"></p><div class="table-wrap"><table><thead><tr><th>항목 ID</th><th>문서</th><th>상위 ID</th><th>하위 ID</th><th>방법</th><th>상태</th></tr></thead><tbody id="traceTable"></tbody></table></div></section>
</main><div id="traceBackdrop" class="backdrop" hidden></div><aside id="traceDetail" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="traceDetailTitle"><div id="traceResize" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="상세 패널 너비 조절" tabindex="0"></div><header class="detail-head"><div><p class="eyebrow">추적 항목 상세</p><h2 id="traceDetailTitle"></h2></div><button id="traceClose" class="secondary">닫기</button></header><div class="detail-tools"><button id="traceNarrow" class="secondary">좁게</button><button id="traceWide" class="secondary">넓게</button><button id="traceDefault" class="secondary">기본 크기</button><span id="traceWidthLabel" class="muted"></span></div><div id="traceDetailBody" class="detail-body"></div></aside></body></html>
